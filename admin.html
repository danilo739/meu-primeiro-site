<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viralium Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0B1120;
    --card:#131C31;
    --card2:#1B2641;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --accent:#3B82F6;
    --gold:#C2A378;
    --border:#23304E;
    --danger:#EF4444;
    --success:#10B981;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#08101F;
    border-right:1px solid var(--border);
    padding:30px 20px;
    position:fixed;
    height:100vh;
    display:none;
}

.logo{
    font-size:1.7rem;
    font-weight:800;
    margin-bottom:40px;
}

.logo span{
    color:var(--accent);
}

/* MAIN */

.main{
    flex:1;
    margin-left:260px;
    padding:30px;
    display:none;
}

/* TOPBAR */

.topbar{
    margin-bottom:30px;
}

.topbar h1{
    font-size:2rem;
    font-weight:800;
}

.topbar p{
    color:var(--muted);
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
}

/* PANEL */

.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:20px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:0.8rem;
    font-weight:700;
    color:var(--muted);
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px;
    color:white;
}

textarea{
    min-height:180px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:var(--accent);
}

/* BUTTON */

.btn{
    background:var(--accent);
    border:none;
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
    width:100%;
}

.btn:hover{
    opacity:0.9;
}

.btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.btn-danger{
    background:var(--danger);
    width:auto;
}

.btn-gold{
    background:var(--gold);
    color:#111;
}

/* PREVIEW */

.preview{
    width:100%;
    height:150px;
    border-radius:15px;
    overflow:hidden;
    background:var(--card2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:10px;
    color:var(--muted);
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TABLE */

.row{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:15px;
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    background:var(--card);
    border:1px solid var(--border);
    padding:40px;
    width:100%;
    max-width:420px;
    border-radius:25px;
}

.login-box h1{
    margin-bottom:10px;
}

.login-box p{
    color:var(--muted);
    margin-bottom:25px;
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        display:none !important;
    }

    .main{
        margin-left:0;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .row{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login-screen">

    <div class="login-box">

        <h1>Viralium Admin</h1>

        <p>Acesso restrito</p>

        <div class="form-group">

            <label>SENHA</label>

            <input
                type="password"
                id="admin-pass"
                placeholder="Digite sua senha"
            >

        </div>

        <button
            class="btn"
            onclick="checkLogin(event)"
        >
            Entrar
        </button>

    </div>

</div>

<!-- SIDEBAR -->

<aside
    class="sidebar"
    id="sidebar"
>

    <div class="logo">
        Viralium<span>.</span>
    </div>

</aside>

<!-- MAIN -->

<main
    class="main"
    id="admin-panel"
>

    <div class="topbar">

        <h1>Painel Administrativo</h1>

        <p>Gerencie sua plataforma em tempo real</p>

    </div>

    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">
            <p>Notícias</p>
            <h2 id="stat-news">0</h2>
        </div>

        <div class="stat-card">
            <p>Comentários</p>
            <h2 id="stat-comments">0</h2>
        </div>

        <div class="stat-card">
            <p>Status</p>
            <h2 style="color:var(--success);">
                Online
            </h2>
        </div>

    </section>

    <!-- NOVA PUBLICAÇÃO -->

    <section class="panel">

        <h2 style="margin-bottom:20px;">
            Nova Publicação
        </h2>

        <div class="form-grid">

            <div class="form-group full">

                <label>TÍTULO</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título da notícia"
                >

            </div>

            <div class="form-group">

                <label>CATEGORIA</label>

                <select id="categoria">

                    <option>TECNOLOGIA</option>
                    <option>POLÍTICA</option>
                    <option>ECONOMIA</option>
                    <option>SAÚDE</option>
                    <option>CULTURA</option>

                </select>

            </div>

            <div class="form-group">

                <label>IMAGEM CAPA</label>

                <input
                    type="file"
                    id="imagem-capa"
                    accept="image/*"
                    onchange="previewImage(this)"
                >

                <div
                    class="preview"
                    id="preview-capa"
                >
                    Preview
                </div>

            </div>

            <div class="form-group full">

                <label>CONTEÚDO</label>

                <textarea
                    id="conteudo"
                    placeholder="Escreva aqui..."
                ></textarea>

            </div>

        </div>

        <button
            class="btn"
            id="btn-publicar"
            onclick="enviarNoticia()"
        >
            Publicar Notícia
        </button>

        <p
            id="msg-status"
            style="margin-top:15px;"
        ></p>

    </section>

    <!-- CONFIG -->

    <section class="panel">

        <h2 style="margin-bottom:20px;">
            Configurações Gerais
        </h2>

        <div class="form-group">

            <label>LINK DO INSTAGRAM</label>

            <input
                type="url"
                id="config-insta"
                placeholder="https://instagram.com/seu-perfil"
            >

        </div>

        <button
            class="btn btn-gold"
            onclick="salvarConfig()"
        >
            Salvar Instagram
        </button>

        <div
            class="form-group"
            style="margin-top:25px;"
        >

            <label>GOOGLE ADSENSE</label>

            <textarea
                id="adsense-code"
                style="min-height:120px;"
            ></textarea>

        </div>

        <button
            class="btn btn-gold"
            onclick="salvarAdsense()"
        >
            Salvar AdSense
        </button>

    </section>

    <!-- NOTÍCIAS -->

    <section class="panel">

        <h2 style="margin-bottom:20px;">
            Gerenciar Notícias
        </h2>

        <div id="lista-noticias-delete"></div>

    </section>

    <!-- COMENTÁRIOS -->

    <section class="panel">

        <h2 style="margin-bottom:20px;">
            Comentários
        </h2>

        <div id="lista-comentarios-delete"></div>

    </section>

</main>

<script>

/* LOGIN */

async function checkLogin(event){

    const senha =
    document.getElementById(
        'admin-pass'
    ).value;

    if(!senha){

        alert("Digite a senha");

        return;

    }

    const btn = event.target;

    btn.disabled = true;

    btn.innerText = "Entrando...";

    try{

        const response =
        await fetch('/api/login',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                senha
            })

        });

        if(response.ok){

            document.getElementById(
                'login-screen'
            ).style.display = 'none';

            document.getElementById(
                'admin-panel'
            ).style.display = 'block';

            document.getElementById(
                'sidebar'
            ).style.display = 'block';

            carregarDadosIniciais();

        }else{

            alert("Senha incorreta");

        }

    }catch(error){

        console.error(error);

        alert("Servidor offline");

    }

    btn.disabled = false;

    btn.innerText = "Entrar";

}

/* CARREGAR */

async function carregarDadosIniciais(){

    carregarGerenciamento();

    try{

        const resAd =
        await fetch('/api/adsense');

        if(resAd.ok){

            const dataAd =
            await resAd.json();

            document.getElementById(
                'adsense-code'
            ).value =
            dataAd.valor || '';

        }

    }catch(error){

        console.error(error);

    }

    try{

        const resConfig =
        await fetch('/api/config/instagram');

        if(resConfig.ok){

            const dataConfig =
            await resConfig.json();

            document.getElementById(
                'config-insta'
            ).value =
            dataConfig.valor || '';

        }

    }catch(error){

        console.error(error);

    }

}

/* PREVIEW */

function previewImage(input){

    const preview =
    document.getElementById(
        'preview-capa'
    );

    const file =
    input.files[0];

    if(file){

        const reader =
        new FileReader();

        reader.onload = function(e){

            preview.innerHTML =
            `<img src="${e.target.result}">`;

        }

        reader.readAsDataURL(file);

    }

}

/* PUBLICAR */

async function enviarNoticia(){

    const status =
    document.getElementById(
        'msg-status'
    );

    const btn =
    document.getElementById(
        'btn-publicar'
    );

    btn.disabled = true;

    btn.innerText = "Publicando...";

    const formData =
    new FormData();

    formData.append(
        'titulo',
        document.getElementById(
            'titulo'
        ).value
    );

    formData.append(
        'categoria',
        document.getElementById(
            'categoria'
        ).value
    );

    formData.append(
        'conteudo',
        document.getElementById(
            'conteudo'
        ).value
    );

    const imagem =
    document.getElementById(
        'imagem-capa'
    ).files[0];

    if(imagem){

        formData.append(
            'capa',
            imagem
        );

    }

    try{

        const response =
        await fetch('/api/noticias',{

            method:'POST',
            body:formData

        });

        if(response.ok){

            status.innerText =
            "✅ Publicado com sucesso";

            status.style.color =
            "#10B981";

            carregarGerenciamento();

        }else{

            status.innerText =
            "❌ Erro ao publicar";

        }

    }catch(error){

        console.error(error);

        status.innerText =
        "❌ Servidor offline";

    }

    btn.disabled = false;

    btn.innerText = "Publicar Notícia";

}

/* CONFIG */

async function salvarConfig(){

    const valor =
    document.getElementById(
        'config-insta'
    ).value;

    try{

        await fetch('/api/config',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                chave:'instagram',
                valor

            })

        });

        alert("Instagram salvo");

    }catch(error){

        console.error(error);

    }

}

async function salvarAdsense(){

    const codigoAdsense =
    document.getElementById(
        'adsense-code'
    ).value;

    try{

        await fetch('/api/adsense',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                codigoAdsense
            })

        });

        alert("AdSense salvo");

    }catch(error){

        console.error(error);

    }

}

/* GERENCIAMENTO */

async function carregarGerenciamento(){

    try{

        const resNoticias =
        await fetch('/api/noticias');

        const noticias =
        await resNoticias.json();

        document.getElementById(
            'stat-news'
        ).innerText =
        noticias.length;

        document.getElementById(
            'lista-noticias-delete'
        ).innerHTML =
        noticias.map(n => `

            <div class="row">

                <span>${n.titulo}</span>

                <button
                    class="btn btn-danger"
                    onclick="excluirItem(
                        'noticias',
                        ${n.id}
                    )"
                >
                    Excluir
                </button>

            </div>

        `).join('');

    }catch(error){

        console.error(error);

    }

    try{

        const resComentarios =
        await fetch('/api/comentarios');

        const comentarios =
        await resComentarios.json();

        document.getElementById(
            'stat-comments'
        ).innerText =
        comentarios.length;

        document.getElementById(
            'lista-comentarios-delete'
        ).innerHTML =
        comentarios.map(c => `

            <div class="row">

                <span>

                    <strong>${c.nome}</strong>

                    — ${c.texto.substring(0,60)}...

                </span>

                <button
                    class="btn btn-danger"
                    onclick="excluirItem(
                        'comentarios',
                        ${c.id}
                    )"
                >
                    Remover
                </button>

            </div>

        `).join('');

    }catch(error){

        console.error(error);

    }

}

/* EXCLUIR */

async function excluirItem(tipo,id){

    if(!confirm(
        "Excluir permanentemente?"
    )) return;

    try{

        await fetch(
            `/api/${tipo}/${id}`,
            {
                method:'DELETE'
            }
        );

        carregarGerenciamento();

    }catch(error){

        console.error(error);

    }

}

</script>

</body>
</html>
