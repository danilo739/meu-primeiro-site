<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comunidade - Viralium</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    --bg:#F1F5F9;
    --dark:#0F172A;
    --gold:#C2A378;
    --text:#475569;
    --border:#E2E8F0;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:var(--bg);

    font-family:'Inter',sans-serif;

    color:var(--dark);

}

/* HEADER */

.header{

    background:linear-gradient(
        135deg,
        #0F172A,
        #1E293B
    );

    color:white;

    padding:60px 20px;

    text-align:center;

    position:relative;

}

.back-btn{

    position:absolute;

    left:20px;
    top:20px;

    color:var(--gold);

    text-decoration:none;

    font-weight:700;

    font-size:0.95rem;

}

.header h1{

    font-size:2.5rem;

    font-weight:800;

    margin-bottom:10px;

}

.header p{

    color:#CBD5E1;

    font-size:1rem;

}

/* CONTAINER */

.container{

    max-width:750px;

    margin:-40px auto 60px;

    padding:0 15px;

}

/* POST BOX */

.caixa-post{

    background:white;

    padding:25px;

    border-radius:25px;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.05);

    margin-bottom:30px;

    border:1px solid #E5E7EB;

}

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

}

input,
textarea{

    width:100%;

    padding:14px;

    border:1px solid var(--border);

    border-radius:14px;

    font-size:0.95rem;

    font-family:'Inter',sans-serif;

    transition:0.2s;

}

input:focus,
textarea:focus{

    outline:none;

    border-color:var(--gold);

}

textarea{

    min-height:140px;

    resize:vertical;

    margin-top:15px;

}

.btn-post{

    width:100%;

    background:var(--dark);

    color:white;

    border:none;

    padding:15px;

    border-radius:14px;

    font-weight:800;

    cursor:pointer;

    margin-top:15px;

    transition:0.2s;

    font-size:0.95rem;

}

.btn-post:hover{

    background:var(--gold);

    color:var(--dark);

}

/* STATUS */

.status{

    margin-top:15px;

    text-align:center;

    font-weight:700;

    font-size:0.9rem;

}

/* POSTS */

.mural-title{

    font-size:1.4rem;

    margin-bottom:20px;

    font-weight:800;

}

.card-post{

    background:white;

    padding:22px;

    border-radius:22px;

    margin-bottom:18px;

    border:1px solid #E5E7EB;

    box-shadow:
    0 4px 10px rgba(0,0,0,0.03);

    transition:0.2s;

}

.card-post:hover{

    transform:translateY(-3px);

}

.post-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

    gap:10px;

}

.post-user{

    display:flex;

    flex-direction:column;

}

.post-user strong{

    color:var(--dark);

    font-size:1rem;

}

.post-email{

    color:#64748B;

    font-size:0.8rem;

}

.post-date{

    color:#94A3B8;

    font-size:0.75rem;

}

.card-post p{

    margin-top:10px;

    color:var(--text);

    line-height:1.7;

    word-break:break-word;

}

/* EMPTY */

.empty{

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    color:#94A3B8;

}

/* MOBILE */

@media(max-width:700px){

    .form-grid{

        grid-template-columns:1fr;

    }

    .header h1{

        font-size:2rem;

    }

    .post-top{

        flex-direction:column;

        align-items:flex-start;

    }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <a href="index.html" class="back-btn">
        ← VOLTAR
    </a>

    <h1>Comunidade Viralium</h1>

    <p>
        Compartilhe ideias, opiniões e participe da comunidade
    </p>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- POST BOX -->

    <div class="caixa-post">

        <div class="form-grid">

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
            >

            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
            >

        </div>

        <textarea
            id="texto"
            placeholder="O que você está pensando?"
        ></textarea>

        <button
            class="btn-post"
            onclick="enviar()"
        >
            PUBLICAR NA COMUNIDADE
        </button>

        <div
            class="status"
            id="status"
        ></div>

    </div>

    <!-- POSTS -->

    <h2 class="mural-title">
        Publicações da Comunidade
    </h2>

    <div id="mural"></div>

</div>

<script>

async function carregar(){

    try{

        const res =
        await fetch(
            'http://localhost:3000/api/comentarios'
        );

        const dados =
        await res.json();

        if(!dados.length){

            document.getElementById(
                'mural'
            ).innerHTML = `

                <div class="empty">
                    Nenhuma publicação ainda.
                </div>

            `;

            return;

        }

        document.getElementById(
            'mural'
        ).innerHTML = dados.reverse().map(c => `

            <div class="card-post">

                <div class="post-top">

                    <div class="post-user">

                        <strong>${c.nome}</strong>

                        <span class="post-email">
                            ${c.email || 'E-mail não informado'}
                        </span>

                    </div>

                    <span class="post-date">
                        Comunidade
                    </span>

                </div>

                <p>${c.texto}</p>

            </div>

        `).join('');

    }catch(error){

        console.error(error);

    }

}

/* ENVIAR */

async function enviar(){

    const nome =
    document.getElementById(
        'nome'
    ).value;

    const email =
    document.getElementById(
        'email'
    ).value;

    const texto =
    document.getElementById(
        'texto'
    ).value;

    const status =
    document.getElementById(
        'status'
    );

    if(!nome || !email || !texto){

        return alert(
            "Preencha todos os campos"
        );

    }

    status.innerText =
    "Publicando...";

    try{

        await fetch(
            'http://localhost:3000/api/comentarios',
            {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({

                    nome,
                    email,
                    texto

                })

            }
        );

        status.innerText =
        "✅ Publicado com sucesso";

        status.style.color =
        "green";

        document.getElementById(
            'texto'
        ).value = "";

        carregar();

    }catch(error){

        console.error(error);

        status.innerText =
        "❌ Erro ao publicar";

        status.style.color =
        "red";

    }

}

/* INIT */

carregar();

</script>

</body>
</html>
