<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viralium Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0B1120;
    --card:#131C31;
    --card2:#1B2641;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --accent:#3B82F6;
    --gold:#C2A378;
    --border:#23304E;
    --danger:#EF4444;
    --success:#10B981;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#08101F;
    border-right:1px solid var(--border);
    padding:30px 20px;
    position:fixed;
    height:100vh;
}

.logo{
    font-size:1.7rem;
    font-weight:800;
    margin-bottom:40px;
}

.logo span{
    color:var(--accent);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu button{
    width:100%;
    background:transparent;
    color:var(--muted);
    border:none;
    padding:15px;
    border-radius:12px;
    text-align:left;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.menu button:hover{
    background:var(--card);
    color:white;
}

.menu button.active{
    background:var(--accent);
    color:white;
}

/* MAIN */

.main{
    flex:1;
    margin-left:260px;
    padding:30px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:2rem;
    font-weight:800;
}

.topbar p{
    color:var(--muted);
    margin-top:5px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
}

.stat-card h2{
    font-size:2rem;
    margin-top:10px;
}

/* PANEL */

.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.panel h2{
    margin-bottom:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:20px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:0.8rem;
    font-weight:700;
    color:var(--muted);
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px;
    color:white;
    font-size:0.95rem;
}

textarea{
    min-height:180px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:var(--accent);
}

/* BUTTON */

.btn{
    background:var(--accent);
    border:none;
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.btn-danger{
    background:var(--danger);
}

.btn-gold{
    background:var(--gold);
    color:#111;
}

/* PREVIEW */

.preview{
    width:100%;
    max-width:250px;
    height:150px;
    border-radius:15px;
    overflow:hidden;
    background:var(--card2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:10px;
    color:var(--muted);
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TABLE */

.table{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.row{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.row span{
    flex:1;
    word-break:break-word;
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    background:var(--card);
    border:1px solid var(--border);
    padding:40px;
    width:100%;
    max-width:420px;
    border-radius:25px;
}

.login-box h1{
    margin-bottom:10px;
}

.login-box p{
    color:var(--muted);
    margin-bottom:25px;
}

/* MOBILE */

@media(max-width:900px){

    body{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .main{
        margin-left:0;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .row{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<!-- LOGIN -->
<div id="admin-panel">
    <hr style="margin:30px 0; border:none; border-top:1px solid #E2E8F0;">

<div class="config-box">

    <h2 style="
        font-size:1.2rem;
        margin-bottom:20px;
        color:#0F172A;
    ">
        Configurações do Site
    </h2>

    <div class="form-group">

        <label>
            LINK DO INSTAGRAM
        </label>

        <input
            type="url"
            id="config-insta"
            placeholder="https://instagram.com/seuperfil"
        >

    </div>

    <button
        onclick="salvarConfig()"
        style="
            background:#C2A378;
            color:#0F172A;
            width:100%;
            border:none;
            padding:14px;
            border-radius:12px;
            font-weight:800;
            cursor:pointer;
            margin-top:10px;
        "
    >
        SALVAR CONFIGURAÇÕES
    </button>

</div>
</div>
<div id="login-screen">

    <div class="login-box">

        <h1>Viralium Admin</h1>

        <p>Painel administrativo </p>

        <div class="form-group">

            <label>SENHA</label>

            <input
                type="password"
                id="admin-pass"
                placeholder="Digite sua senha"
            >

        </div>

        <button class="btn" onclick="checkLogin()">
            Entrar
        </button>

    </div>

</div>


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        Viralium<span>.</span>
    </div>

    



       

</aside>

<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <div>

            <h1>Painel Administrativo</h1>

            <p>Gerencie sua plataforma</p>

        </div>

    </div>

    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">
            <p>Total Notícias</p>
            <h2 id="stat-news">0</h2>
        </div>

        <div class="stat-card">
            <p>Comentários</p>
            <h2 id="stat-comments">0</h2>
        </div>

        <div class="stat-card">
            <p>Status</p>
            <h2 style="color:var(--success);">Online</h2>
        </div>

    </section>

    <!-- PUBLICAR -->

    <section class="panel">

        <h2>Nova Publicação</h2>

        <div class="form-grid">

            <div class="form-group full">

                <label>TÍTULO</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título da notícia"
                >

            </div>

            <div class="form-group">

                <label>CATEGORIA</label>

                <select id="categoria">
                    <option>TECNOLOGIA</option>
                    <option>POLÍTICA</option>
                    <option>ECONOMIA</option>
                    <option>SAÚDE</option>
                    <option>CULTURA</option>
                    <option>OUTROS</option>
                </select>

            </div>

            <div class="form-group">

                <label>IMAGEM CAPA</label>

                <input
                    type="file"
                    id="imagem-capa"
                    accept="image/*"
                    onchange="previewImage(this)"
                >

            </div>

            <div class="preview" id="preview-capa">
                Preview
            </div>

            <div class="form-group full">

                <label>CONTEÚDO</label>

                <textarea
                    id="conteudo"
                    placeholder="Escreva a notícia..."
                ></textarea>

            </div>

        </div>

        <button class="btn" onclick="enviarNoticia()">
            Publicar Notícia
        </button>

        <p id="msg-status" style="margin-top:15px;"></p>

    </section>

    <!-- ADSENSE -->

    <section class="panel">

        <h2>Google AdSense</h2>

        <div class="form-group">

            <label>CÓDIGO</label>

            <textarea
                id="adsense-code"
                placeholder="Cole o código do AdSense"
                style="min-height:120px;"
            ></textarea>

        </div>

        <button
            class="btn btn-gold"
            onclick="salvarAdsense()"
        >
            Salvar AdSense
        </button>

    </section>

    <!-- NOTÍCIAS -->

    <section class="panel">

        <h2>Gerenciar Notícias</h2>

        <div
            class="table"
            id="lista-noticias-delete"
        ></div>

    </section>

    <!-- COMENTÁRIOS -->

    <section class="panel">

        <h2>Comentários</h2>

        <div
            class="table"
            id="lista-comentarios-delete"
        ></div>

    </section>

</main>

<script>

/* LOGIN */

/* LOGIN */

window.onload = function(){

    document.getElementById(
        'login-screen'
    ).style.display = 'flex';

};

async function checkLogin(){

    const senha =
    document.getElementById(
        'admin-pass'
    ).value;

    if(!senha){

        return alert("Digite uma senha");

    }

    try{

        const response =
        await fetch(
            'http://localhost:3000/api/login',
            {
                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    senha
                })

            }
        );

        if(response.ok){

            abrirPainel();

            carregarGerenciamento();

        }else{

            alert("Senha incorreta!");

        }

    }catch(error){

        console.error(error);

        alert(
            "Servidor offline"
        );

    }

}

function abrirPainel(){

    document.getElementById(
        'login-screen'
    ).style.display = 'none';

    carregarAdsenseSalvo();

}

/* ADSENSE */

async function carregarAdsenseSalvo(){

    try{

        const res =
        await fetch(
            'http://localhost:3000/api/adsense'
        );

        const data =
        await res.json();

        if(data.valor){

            document.getElementById(
                'adsense-code'
            ).value = data.valor;

        }

    }catch(e){

        console.error(e);

    }

}

async function salvarAdsense(){

    const codigo =
    document.getElementById(
        'adsense-code'
    ).value;

    try{

        const response =
        await fetch(
            'http://localhost:3000/api/adsense',
            {
                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    codigoAdsense:codigo
                })

            }
        );

        if(response.ok){

            alert("AdSense salvo");

        }

    }catch(error){

        console.error(error);

    }

}

/* PREVIEW */

function previewImage(input){

    const preview =
    document.getElementById(
        'preview-capa'
    );

    const file = input.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            preview.innerHTML =
            `<img src="${e.target.result}">`;

        }

        reader.readAsDataURL(file);

    }

}

/* PUBLICAR */

async function enviarNoticia(){

    const status =
    document.getElementById('msg-status');

    const formData =
    new FormData();

    formData.append(
        'titulo',
        document.getElementById('titulo').value
    );

    formData.append(
        'categoria',
        document.getElementById('categoria').value
    );

    formData.append(
        'conteudo',
        document.getElementById('conteudo').value
    );

    formData.append(
        'capa',
        document.getElementById('imagem-capa').files[0]
    );

    status.innerText = "Publicando...";

    try{

        const response =
        await fetch(
            'http://localhost:3000/api/noticias',
            {
                method:'POST',
                body:formData
            }
        );

        const result =
        await response.json();

        if(result.success){

            status.innerText =
            "✅ Publicado";

            status.style.color =
            "#10B981";

            carregarGerenciamento();

        }else{

            status.innerText =
            "❌ Erro";

        }

    }catch(error){

        console.error(error);

        status.innerText =
        "❌ Servidor offline";

    }

}

/* GERENCIAMENTO */
async function salvarConfig(){

    const linkInsta =
    document.getElementById(
        'config-insta'
    ).value;

    try{

        const response =
        await fetch(
            'http://localhost:3000/api/config',
            {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({

                    link_insta:linkInsta

                })

            }
        );

        if(response.ok){

            alert(
                "Instagram atualizado!"
            );

        }

    }catch(error){

        console.error(error);

        alert(
            "Erro ao salvar"
        );

    }

}


async function carregarGerenciamento(){

    try{

        const resNoticias =
        await fetch(
            'http://localhost:3000/api/noticias'
        );

        const noticias =
        await resNoticias.json();

        document.getElementById(
            'stat-news'
        ).innerText = noticias.length;

        document.getElementById(
            'lista-noticias-delete'
        ).innerHTML = noticias.map(n => `

            <div class="row">

                <span>${n.titulo}</span>

                <button
                    class="btn btn-danger"
                    onclick="excluirItem(
                        'noticias',
                        ${n.id}
                    )"
                >
                    Excluir
                </button>

            </div>

        `).join('');

        const resComent =
        await fetch(
            'http://localhost:3000/api/comentarios'
        );

        const comentarios =
        await resComent.json();

        document.getElementById(
            'stat-comments'
        ).innerText =
        comentarios.length;

        document.getElementById(
            'lista-comentarios-delete'
        ).innerHTML = comentarios.map(c => `

            <div class="row">

                <span>

                    <strong>${c.nome}</strong>

                    — ${c.texto.substring(0,60)}...

                </span>

                <button
                    class="btn btn-danger"
                    onclick="excluirItem(
                        'comentarios',
                        ${c.id}
                    )"
                >
                    Remover
                </button>

            </div>

        `).join('');

    }catch(error){

        console.error(error);

    }

}

/* EXCLUIR */

async function excluirItem(tipo,id){

    if(confirm(`Excluir ${tipo}?`)){

        try{

            const response =
            await fetch(
                `http://localhost:3000/api/${tipo}/${id}`,
                {
                    method:'DELETE'
                }
            );

            if(response.ok){

                carregarGerenciamento();

            }

        }catch(error){

            console.error(error);

        }

    }

}

</script>

</body>
</html>
